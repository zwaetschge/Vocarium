# Production overlay
# ---------------------------------------------------------------------------
# Hides backend services from the host network — only the UI (and optionally
# the gateway) are reachable from outside `voice-network`.
#
# Usage:
#   CORS_ORIGINS=https://vocarium.example.com \
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ---------------------------------------------------------------------------

services:
  qwen3-asr:
    ports: !reset []
  qwen3-tts:
    ports: !reset []
  qwen3-tts-2:
    ports: !reset []
  acestep:
    ports: !reset []
  mmaudio:
    ports: !reset []
  # By default, only the UI is published. If you front Vocarium with an
  # external reverse proxy (Authelia / Traefik / nginx), put that proxy on
  # `voice-network` instead of publishing backend ports.
  vocarium-api:
    ports: !reset []
    environment:
      ALLOW_ANONYMOUS: ${ALLOW_ANONYMOUS:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS to your production origin, e.g. https://vocarium.example.com}
  vocarium-api-2:
    ports: !reset []
    environment:
      ALLOW_ANONYMOUS: ${ALLOW_ANONYMOUS:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS to your production origin, e.g. https://vocarium.example.com}
